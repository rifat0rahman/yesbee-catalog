name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\ms-playwright

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Build standalone application
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onedir `
            --windowed `
            --name YesbeeCatalog `
            --collect-all playwright `
            --collect-all fastapi `
            --collect-all uvicorn `
            --collect-all pydantic `
            --collect-all dotenv `
            --add-data "templates;templates" `
            --add-data "ms-playwright;ms-playwright" `
            main.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yesbee-Catalog-Windows-Installer
          path: dist\YesbeeCatalogSetup.exe
          if-no-files-found: error

      - name: Publish tagged installer
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist\YesbeeCatalogSetup.exe
